[workspace]
members = [ "airq", "scd30", "sps30"]
resolver = "2"

[workspace.dependencies]
log = "0.4.22"
num_enum = { version = "0.7.3", default-features = false }
heapless = { version = "0.8.0", features = ["defmt-03"] }
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
embedded-hal = "1.0.0"
embedded-hal-nb = "1.0.0"
embedded-hal-async = "1.0.0"
defmt = "0.3"


[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = 'z'

# TODO: Remove this once bluetooth support lands on crates.io
[patch.crates-io]
trouble-host = { git = "https://github.com/embassy-rs/trouble.git", rev = "c3423d04b9541a1cf00a477c0d436ecca67c0768" }
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "45d9bd57" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "45d9bd57" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "45d9bd57" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "45d9bd57" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "45d9bd57" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "45d9bd57" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "45d9bd57" }
