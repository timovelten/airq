[workspace]
members = [ "cross", "scd30", "sps30"]
resolver = "2"

[workspace.dependencies]
log = "0.4.22"
num_enum = { version = "0.7.3", default-features = false }
heapless = { version = "0.8.0", features = ["defmt-03"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-hal = "1.0.0"
embedded-hal-nb = "1.0.0"
embedded-hal-async = "1.0.0"
defmt = "1.2.0"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = 'z'

[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "508c2c06913" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "508c2c06913" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "508c2c06913" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "508c2c06913" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "508c2c06913" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "508c2c06913" }
embassy-futures  = { git = "https://github.com/embassy-rs/embassy", rev = "508c2c0" }