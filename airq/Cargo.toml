[package]
edition = "2021"
name = "airq"
version = "0.1.0"
authors = ["timo"]

[dependencies]
rtt-target = { version = "0.6.1", features = ["defmt", "log"] }
panic-probe = { version = "0.3", features = ["print-defmt"] }

defmt.workspace = true

embedded-hal.workspace = true
embedded-hal-nb.workspace = true
embedded-hal-async.workspace = true
embedded-io.workspace = true
embedded-io-async.workspace = true
embedded-storage = "0.3.1"

cortex-m-rt = "0.7.3"

embassy-executor = { version = "0.6", features = ["task-arena-size-16384", "arch-cortex-m", "executor-thread", "defmt", "integrated-timers", "executor-interrupt"] }
embassy-sync = { version = "0.6" }
embassy-time = { version = "0.3", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.2", features = ["rp2040", "defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
embassy-futures = "0.1.1"

bt-hci = { version = "0.1.0", default-features = false, features = ["defmt"] }
trouble-host = { version = "0.1.0", features = ["defmt", "gatt"] }
cyw43 = { version = "0.2.0", features = ["bluetooth"] }
cyw43-pio = { version = "0.2.0", features = ["defmt"] }

cortex-m = { version = "0.7.6" }
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }

sps30 = { path = "../sps30" }
scd30 = { path = "../scd30" }
